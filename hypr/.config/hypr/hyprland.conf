# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
    monitor = eDP-1, prefered, 0x0, 1
    monitor = HDMI-A-1, disable

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_THEME, catppuccin-macchiato-dark-cursors
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, catppuccin-macchiato-dark-cursors
env = HYPRCURSOR_SIZE, 24
# env = __GLX_VENDOR_LIBRARY_NAME, nvidia
# env = LIBVA_DRIVER_NAME, nvidia

cursor {
    no_hardware_cursors = true
}

ecosystem {
    no_donation_nag = true
}

#####################
### LOOK AND FEEL ###
#####################

source = ~/dotfiles/extern/catppuccin/hyprland/themes/macchiato.conf

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 6

    border_size = 2

    # gaps_in = 0
    # gaps_out = 0

    # border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = 0xee$mauveAlpha 0xee$blueAlpha 45deg
    col.inactive_border = 0xee$overlay0Alpha

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
    hover_icon_on_border = true

    no_focus_fallback = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
    # layout = hy3
}

group {
    focus_removed_window = true
    group_on_movetoworkspace = true

    col.border_active = 0xee$mauveAlpha 0xee$blueAlpha 45deg
    col.border_inactive = 0xee$overlay0Alpha

    groupbar {
        enabled = true
        font_family = Cantarell
        font_size = 14
        font_weight_active = bold
        gradients = true
        height = 24
        indicator_gap = 0
        indicator_height = 0
        stacked = false
        scrolling = false
        rounding = 0
        gradient_rounding = 12
        text_color = $text
        col.active = 0xe6$baseAlpha
        col.inactive = 0xaa$baseAlpha
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 15
    # rounding = 0

    # Change transparency of focused and unfocused windows
    active_opacity = 0.9
    inactive_opacity = 0.8

    dim_special = 0.3

    shadow {
        enabled = false
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

windowrule = opaque on, match:class (Alacritty)
windowrule = opaque on, match:class (scrcpy)
windowrule = opaque on, match:class (neovide)
windowrule = opaque on, match:class (dolphin-emu)
windowrule = opaque on, match:class (notes)
windowrule = opaque on, match:class (firefox)
windowrule = opaque on, match:class (Brave-browser)
windowrule = opaque on, match:class (brave-browser)
windowrule = opaque on, match:class (Chromium)
windowrule = opaque on, match:class (chromium)
windowrule = opaque on, match:class (vlc)
windowrule = opaque on, match:class (Gimp-2.10)
windowrule = opaque on, match:class (Gimp)
windowrule = opaque on, match:class (gimp)
windowrule = opaque on, match:class (org.inkscape.Inkscape)
windowrule = opaque on, match:class (eog)
windowrule = opaque on, match:class (org.gnome.eog)
windowrule = opaque on, match:class (mpv)
windowrule = opaque on, match:class (steam)
windowrule = opaque on, match:class (heroic)
windowrule = opaque on, match:class (Skype)
windowrule = opaque on, match:class (net.kuribo64.melonDS)
windowrule = opaque on, match:class (org.kde.kdenlive)
windowrule = opaque on, match:class (blender)

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 2, myBezier
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 0, 8, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 1, default, slide
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    force_split = 2
}

# Smart gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
windowrule = rounding 0, match:float 0, match:workspace f[1]
#
workspace = special:magic, gapsout:6, gapsin:3
windowrule = border_size 2, match:float 0, match:workspace special:magic
windowrule = rounding 15, match:float 0, match:workspace special:magic

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    font_family = Cantarell
    disable_autoreload = false
    on_focus_under_fullscreen = 2 # unfullscreen / unmaxize
    render_unfocused_fps = 10
    close_special_on_empty = false
}

binds {
    hide_special_on_workspace_change = true
    movefocus_cycles_groupfirst = true
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = fr, us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0.0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        disable_while_typing = true
        natural_scroll = true
    }
}

source = ~/.config/hypr/hyprland/gestures.conf

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = steelseries-steelseries-rival-5
    accel_profile = flat
    sensitivity = 0.0
}

device {
    name = at-translated-set-2-keyboard
    repeat_rate = 30
    repeat_delay = 350
}

device {
    name = liteon-technology-usb-keyboard
    repeat_rate = 30
    repeat_delay = 350
}

# source = ~/.config/hypr/hyprland/plugins.conf

source = ~/.config/hypr/hyprland/bind.conf

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule = workspace 1 silent, match:class (neovide)
windowrule = workspace 1 silent, match:class (Code)
windowrule = workspace 1 silent, match:class (jetbrains-clion)
windowrule = workspace 1 silent, match:class (jetbrains-idea)
windowrule = workspace 1 silent, match:class (jetbrains-studio)
windowrule = workspace 1 silent, match:class (fr.dwightstudio.jarmemu.base.gui.JArmEmuApplication)
windowrule = workspace 1 silent, match:class (dolphin-emu)
windowrule = workspace 1 silent, match:class (steam)
windowrule = workspace 1 silent, match:class (heroic)
windowrule = workspace 1 silent, match:class (rstudio)

windowrule = workspace 3 silent, match:class (firefox)
windowrule = workspace 3 silent, match:class (Brave-browser)
windowrule = workspace 3 silent, match:class (brave-browser)
windowrule = workspace 3 silent, match:class (Chromium)
windowrule = workspace 3 silent, match:class (chromium)

windowrule = workspace 4 silent, match:class (vlc)
windowrule = workspace 4 silent, match:class (mpv)
windowrule = workspace 4 silent, match:class (io.bassi.Amberol)

windowrule = workspace 5 silent, match:class (discord)
windowrule = workspace 5 silent, match:class (teams-for-linux)
windowrule = workspace 5 silent, match:class (Signal)

windowrule = float true, match:class (engrampa), match:title (Extraire)
windowrule = float true, match:title (Opération sur des fichiers en cours)
windowrule = float true, match:title (Renommer ).*

source = ~/.config/hypr/hyprland/autostart.conf
