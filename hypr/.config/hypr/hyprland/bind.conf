###################
### KEYBINDINGS ###
###################

# https://wiki.hyprland.org/Configuring/Keywords/
# https://wiki.hyprland.org/Configuring/Binds/

# l -> locked, will also work when an input inhibitor (e.g. a lockscreen) is active.
# r -> release, will trigger on release of a key.
# o -> longPress, will trigger on long press of a key.
# e -> repeat, will repeat when held.
# n -> non-consuming, key/mouse events will be passed to the active window in addition to triggering the dispatcher.
# m -> mouse, see below.
# t -> transparent, cannot be shadowed by other binds.
# i -> ignore mods, will ignore modifiers.
# s -> separate, will arbitrarily combine keys between each mod/key, see [Keysym combos](#keysym-combos) above.
# d -> has description, will allow you to write a description for your bind.
# p -> bypasses the app's requests to inhibit keybinds.

$mainMod = SUPER

bind = $mainMod, Return, exec, $TERMINAL
bind = $mainMod, X, exec, $BROWSER
bind = $mainMod, E, exec, thunar
bind = $mainMod SHIFT, E, exec, $TERMINAL -e yazi
bind = $mainMod SHIFT, D, exec, discord

bind = $mainMod, D, exec, pkill rofi || rofi -show drun
bind = $mainMod, A, exec, pkill rofi || rofi -show window
bind = $mainMod, M, exec, pkill rofi || music-selector
bind = $mainMod SHIFT, M, exec, pkill rofi || music-selector --songs
bind = $mainMod, Escape, exec, loginctl lock-session
bind = $mainMod, B, exec, swaync-client --toggle-panel
bind = $mainMod, V, exec, swaync-client --hide-all
# bind = $mainMod, Tab, hyprexpo:expo, toggle

bind = $mainMod SHIFT, Space, exec, toggle-keyboard

bind = $mainMod, Q, killactive,
bind = $mainMod, G, togglefloating,
bind = $mainMod, O, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen
bind = CTRL $mainMod, F, fullscreenstate, 0, 3
bind = $mainMod SHIFT, F, exec, killall -SIGUSR1 waybar
bind = $mainMod, N, fullscreen, 1
bind = $mainMod, S, togglegroup
bind = $mainMod, Space, exec, hyprctl dispatch focuswindow $(if [[ $(hyprctl activewindow -j | jq .floating) == "true" ]]; then echo "tiled"; else echo "floating"; fi;)

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, H, movewindoworgroup, l
bind = $mainMod SHIFT, L, movewindoworgroup, r
bind = $mainMod SHIFT, K, movewindoworgroup, u
bind = $mainMod SHIFT, J, movewindoworgroup, d

bind = $mainMod, R, submap, Resize

submap = Resize

bind = $mainMod, R, submap, reset
bind = , Return, submap, reset
bind = , Escape, submap, reset

binde = , H, resizeactive, -50 0
binde = , L, resizeactive, 50 0
binde = , K, resizeactive, 0 -50
binde = , J, resizeactive, 0 50

submap = reset

# Switch workspaces with mainMod + [0-9]
bindt = $mainMod, ampersand,  workspace, 1
bindt = $mainMod, eacute,     workspace, 2
bindt = $mainMod, quotedbl,   workspace, 3
bindt = $mainMod, apostrophe, workspace, 4
bindt = $mainMod, parenleft,  workspace, 5
bindt = $mainMod, minus,      workspace, 6
bindt = $mainMod, egrave,     workspace, 7
bindt = $mainMod, underscore, workspace, 8
bindt = $mainMod, ccedilla,   workspace, 9
bindt = $mainMod, agrave,     workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, ampersand,  movetoworkspace, 1
bind = $mainMod SHIFT, eacute,     movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl,   movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft,  movetoworkspace, 5
bind = $mainMod SHIFT, minus,      movetoworkspace, 6
bind = $mainMod SHIFT, egrave,     movetoworkspace, 7
bind = $mainMod SHIFT, underscore, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla,   movetoworkspace, 9
bind = $mainMod SHIFT, agrave,     movetoworkspace, 10

bind = CTRL $mainMod, ampersand,  movetoworkspacesilent, 1
bind = CTRL $mainMod, eacute,     movetoworkspacesilent, 2
bind = CTRL $mainMod, quotedbl,   movetoworkspacesilent, 3
bind = CTRL $mainMod, apostrophe, movetoworkspacesilent, 4
bind = CTRL $mainMod, parenleft,  movetoworkspacesilent, 5
bind = CTRL $mainMod, minus,      movetoworkspacesilent, 6
bind = CTRL $mainMod, egrave,     movetoworkspacesilent, 7
bind = CTRL $mainMod, underscore, movetoworkspacesilent, 8
bind = CTRL $mainMod, ccedilla,   movetoworkspacesilent, 9
bind = CTRL $mainMod, agrave,     movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, Z, togglespecialworkspace, magic
bind = $mainMod SHIFT, Z, movetoworkspace, special:magic
bind = CTRL $mainMod, Z, movetoworkspacesilent, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, r-1
bind = $mainMod, mouse_up, workspace, r+1
bind = $mainMod SHIFT, mouse_down, movetoworkspace, r-1
bind = $mainMod SHIFT, mouse_up, movetoworkspace, r+1

bind = CTRL $mainMod, H, workspace, r-1
bind = CTRL $mainMod, L, workspace, r+1
bind = CTRL $mainMod SHIFT, H, movetoworkspace, r-1
bind = CTRL $mainMod SHIFT, L, movetoworkspace, r+1

bind = $mainMod ALT, H, movecurrentworkspacetomonitor, l
bind = $mainMod ALT, L, movecurrentworkspacetomonitor, r
bind = $mainMod ALT, J, movecurrentworkspacetomonitor, d
bind = $mainMod ALT, K, movecurrentworkspacetomonitor, u

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume 3 && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -3 && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bind = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

bindel = , Prior, exec, swayosd-client --output-volume 3 && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bindel = , Next, exec, swayosd-client --output-volume -3 && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bindl =  , End, exec, swayosd-client --output-volume mute-toggle && paplay /usr/share/sounds/freedesktop/stereo/audio-volume-change.oga
bind = SHIFT, End, exec, swayosd-client --input-volume mute-toggle

bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness +5
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness -5

bindl = SHIFT, XF86MonBrightnessUp, exec, swayosd-client --brightness 100
bindl = SHIFT, XF86MonBrightnessDown, exec, swayosd-client --brightness 5

bindel = $mainMod, Prior, exec, swayosd-client --brightness +5
bindel = $mainMod, Next, exec, swayosd-client --brightness -5

bindl = $mainMod SHIFT, Prior, exec, swayosd-client --brightness 100
bindl = $mainMod SHIFT, Next, exec, swayosd-client --brightness 5

# bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
# bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
# bindl = , XF86AudioPrev, exec, swayosd-client --playerctl previous

bindl = $mainMod, I, exec, swayosd-client --playerctl next
bindl = $mainMod, U, exec, swayosd-client --playerctl play-pause
bindl = $mainMod, Y, exec, swayosd-client --playerctl previous

bind = , PRINT, exec, hyprshot --mode region --freeze --output-folder $HOME/Images/screenshots
bind = $mainMod, PRINT, exec, hyprshot --mode output --mode eDP-1 --output-folder $HOME/Images/screenshots

# Passthrough mode to pass all keyboard shortcuts virtual-box VM.
bind = $mainMod, Delete, submap, Passthrough
submap = Passthrough
bind = $mainMod, Delete, submap, reset
submap = reset
